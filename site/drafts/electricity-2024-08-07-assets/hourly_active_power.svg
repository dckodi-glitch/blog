<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 520">
<title id="title">Average active power by hour of day</title>
<desc id="desc">Mean of valid minute-average active-power readings in kilowatts, grouped by the source clock hour across the full observation period. An hour is included only when at least 90 percent of its expected minute slots have valid readings. Timestamps are timezone-naive.</desc>
