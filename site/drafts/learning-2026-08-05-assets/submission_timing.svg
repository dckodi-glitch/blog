<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Assessment submission timing</title>
<desc id="desc">Counts of submission records by days before or after the assessment deadline. Banked records and records without a deadline or submission day are excluded from the timing bins. Small cells and complementary cells are suppressed when needed.</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, sans-serif" fill="#172337">
<text x="24" y="32" font-size="21" font-weight="bold">Assessment submission timing</text>
<text x="24" y="56" font-size="14">OULAD 2013-2014; submission records, not unique learners</text>
<text x="24" y="76" font-size="13">Relative day difference = submission day minus deadline day</text>
<text x="24" y="113" font-size="14">More than 7 days early</text>
<rect x="290" y="96" width="328.17" height="22" fill="#235789"/>
<text x="628.1700000000001" y="113" font-size="14">38,599</text>
<text x="24" y="159" font-size="14">1-7 days early</text>
<rect x="290" y="142" width="440.0" height="22" fill="#235789"/>
<text x="740.0" y="159" font-size="14">51,752</text>
<text x="24" y="205" font-size="14">On due day</text>
<rect x="290" y="188" width="250.55" height="22" fill="#235789"/>
<text x="550.55" y="205" font-size="14">29,469</text>
<text x="24" y="251" font-size="14">1-7 days late</text>
<rect x="290" y="234" width="369.13" height="22" fill="#235789"/>
<text x="669.13" y="251" font-size="14">43,416</text>
<text x="24" y="297" font-size="14">More than 7 days late</text>
<rect x="290" y="280" width="50.18" height="22" fill="#235789"/>
<text x="350.18" y="297" font-size="14">5,902</text>
<text x="24" y="343" font-size="14">Banked (excluded)</text>
<rect x="290" y="326" width="16.23" height="22" fill="#235789"/>
<text x="316.23" y="343" font-size="14">1,909</text>
<text x="24" y="389" font-size="14">Missing deadline (excluded)</text>
<rect x="290" y="372" width="24.36" height="22" fill="#235789"/>
<text x="324.36" y="389" font-size="14">2,865</text>
<text x="24" y="435" font-size="14">Missing submission day (excluded)</text>
<rect x="290" y="418" width="0.0" height="22" fill="#235789"/>
<text x="300.0" y="435" font-size="14">0</text>
<text x="24" y="491" font-size="13">Positive cells with fewer than 10 records or people, and complementary cells, are suppressed if needed.</text>
</g></svg>
